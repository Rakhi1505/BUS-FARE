/*CREATE A METHOD TO CHECK IF A NUMBER IS ODD OR EVEN;*/


    <script>
function oddeven(x){// WHAT IS X WILL BE IDENTIFIED BY SEEING THE CONDITION OF IF ELSE;
    if(x%2==0){return 'even';}
    else{return "odd";}
}
let y=oddeven(34);//return even means y ki value even hogi i.e jo ise call kare use return kardo value i.e uski value yah particular cheez kar do
console.log(y);
function greatest(x,y){if(x>y) return x;
    else if(y>x)return y;// I WANT THE VALUE OF THE Y TO BE RETURNED THERFORE NOT WRITTEN INSIDE''
    else return 'BOTH ARE EQUAL';// I WANT THIS TEXT TO BE RETURNED THERE IT IS WRITTEN WITHIN ' '
}
let z=greatest(22,22);
console.log(z);
function celtofar(x){return ((9/5)*x+32);}
let m=celtofar(567);
console.log(m);
    </script>
